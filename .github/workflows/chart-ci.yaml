name: chart-ci

on:
  pull_request:
    paths:
      - 'ragflow/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'ragflow/**'
      - '.github/workflows/**'
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: chart-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # v7: node24 runtime; requires GitHub runner >= 2.327.1 (ubuntu-latest is
      # far ahead of that). No input changes for our usage.
      - uses: actions/checkout@v7

      # v5: node24 runtime; supports Helm 3.x and 4.x version inputs.
      - uses: azure/setup-helm@v5
        with:
          # Pin to the version the chart is developed and verified against
          # locally, so CI results predictably match local `make verify`.
          version: v4.2.4

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Add chart dependency repositories
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo add opensearch https://opensearch-project.github.io/helm-charts/

      - name: Build chart dependencies
        run: helm dependency build ./ragflow

      - name: Lint
        run: |
          for f in minimal full production; do
            helm lint ./ragflow -f ./ragflow/ci/$f-values.yaml
          done

      - name: Render and validate against Kubernetes schemas
        run: |
          for f in minimal full production; do
            helm template rf ./ragflow -n ragflow -f ./ragflow/ci/$f-values.yaml > /tmp/$f.yaml
            kubeconform -strict -summary -ignore-missing-schemas /tmp/$f.yaml
          done

      - name: Negative tests (guardrails must reject bad input)
        run: bash ./ragflow/ci/negative-tests.sh ./ragflow

      - name: Verify no plaintext secrets in rendered default output
        run: |
          # The default values must not be installable without credentials.
          if helm template rf ./ragflow >/dev/null 2>&1; then
            echo "FAIL: chart rendered with no credentials configured"
            exit 1
          fi
          echo "ok: chart refuses to render without credentials"

      - name: Verify fixture passwords only ever land in Secrets
        run: |
          # With chart-managed secretData, the credentials MUST appear in the
          # env Secret (that is the design). What must never happen is a
          # password landing in any other resource kind - ConfigMap, pod env,
          # args, annotations.
          leaked=0
          for f in minimal full production; do
            python3 - "$f" <<'PY'
          import sys, yaml
          f = sys.argv[1]
          needles = ("EXAMPLE-0O1234", "EXAMPLE-12345678",
                     "EXAMPLE:colon*fake", "EXAMPLE:fake-redis*pass",
                     "EXAMPLE-fake-minio-0O9",
                     # legacy fixtures (pre-renaming commits)
                     "0012345", "12345678", "p@ss:word*1",
                     "test-redis-pass", "test-minio-pass")
          bad = False
          for doc in yaml.safe_load_all(open(f"/tmp/{f}.yaml")):
              if not doc:
                  continue
              if doc.get("kind") == "Secret":
                  continue  # the one legitimate place
              text = yaml.safe_dump(doc)
              if any(n in text for n in needles):
                  print(f"FAIL: fixture password found in "
                        f"{doc['kind']}/{doc['metadata']['name']} ({f}.yaml)")
                  bad = True
          sys.exit(1 if bad else 0)
          PY
            [ $? -eq 0 ] || leaked=1
          done
          [ "$leaked" -eq 0 ] && echo "ok: fixture passwords only in Secret resources"

  # Full Helm lifecycle on a real Kubernetes API — kind on the runner, the
  # role-faithful stub image (a few MB), no external dependencies. Proves what
  # template checks cannot: install actually converges, workloads go Ready,
  # hooks run, upgrade works, uninstall leaves only the documented hook
  # resources. ~3 minutes.
  e2e:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: chart-e2e

      - name: Full lifecycle e2e
        run: bash ./ragflow/ci/e2e-deploy.sh
