name: chart-ci

on:
  pull_request:
    paths:
      - 'ragflow/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'ragflow/**'
      - '.github/workflows/**'
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: chart-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # v7: node24 runtime; requires GitHub runner >= 2.327.1 (ubuntu-latest is
      # far ahead of that). No input changes for our usage.
      - uses: actions/checkout@v7

      # v5: node24 runtime; supports Helm 3.x and 4.x version inputs.
      - uses: azure/setup-helm@v5
        with:
          # Pin to the version the chart is developed and verified against
          # locally, so CI results predictably match local `make verify`.
          version: v4.2.4

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Lint
        run: |
          for f in minimal full production; do
            helm lint ./ragflow -f ./ragflow/ci/$f-values.yaml
          done

      - name: Render and validate against Kubernetes schemas
        run: |
          for f in minimal full production; do
            helm template rf ./ragflow -n ragflow -f ./ragflow/ci/$f-values.yaml > /tmp/$f.yaml
            kubeconform -strict -summary -ignore-missing-schemas /tmp/$f.yaml
          done

      - name: Negative tests (guardrails must reject bad input)
        run: bash ./ragflow/ci/negative-tests.sh ./ragflow

      - name: Verify no plaintext secrets in rendered default output
        run: |
          # The default values must not be installable without credentials.
          if helm template rf ./ragflow >/dev/null 2>&1; then
            echo "FAIL: chart rendered with no credentials configured"
            exit 1
          fi
          echo "ok: chart refuses to render without credentials"

      - name: Verify no fixture passwords in rendered manifests
        run: |
          # Fixture passwords (0012345 etc.) must exist only in the values
          # files, never in rendered Secrets/ConfigMaps that a user might
          # treat as a template.
          for f in minimal full production; do
            if grep -rE "(0012345|12345678|p@ss:word\*1|test-redis-pass|test-minio-pass)" /tmp/$f.yaml; then
              echo "FAIL: fixture password leaked into rendered $f.yaml"
              exit 1
            fi
          done
          echo "ok: rendered manifests contain no fixture passwords"
