image:
  registry: ""
  repository: ragflow-stub
  tag: "v0.27.0"
  pullPolicy: IfNotPresent

# Deliberately nasty FAKE passwords (EXAMPLE-* marker so secret scanners
# ignore them). Unquoted (as upstream renders them) these become:
# octal-int, a YAML parse error, and a plain int.
secretData:
  MYSQL_PASSWORD: "EXAMPLE-0O1234"
  REDIS_PASSWORD: "EXAMPLE:colon*fake"
  MINIO_PASSWORD: "EXAMPLE-12345678"

metadataDb:
  type: mysql
  host: mysql.smoke.svc
  port: 3306
  user: ragflow
redis:
  host: redis.smoke.svc
storage:
  minio:
    host: minio.smoke.svc
docEngine:
  type: infinity
  infinity:
    host: infinity.smoke.svc

api:
  replicaCount: 2
  # Small enough that the whole release fits a single kind node.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # The stub can't bind :80 as non-root, so it serves on 8080. Real HTTP probe
  # machinery is still exercised — only the port differs from production.
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 6
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 6
  startupProbe:
    enabled: false

executor:
  replicaCount: 3
  workers: 2
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Exercises the REAL exec probe, including the [r] self-match fix.
  livenessProbe:
    enabled: true
    exec:
      command:
        - /bin/sh
        - -c
        - pgrep -f "[r]ag/svr/task_executor.py" > /dev/null
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 4
  startupProbe:
    enabled: false

datasync:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  livenessProbe:
    enabled: true
    exec:
      command:
        - /bin/sh
        - -c
        - pgrep -f "[r]ag/svr/sync_data_source.py" > /dev/null
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 4

migration:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: ragflow.smoke.local
      paths:
        - path: /
          pathType: Prefix
