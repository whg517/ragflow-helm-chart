# Minimal viable production values.
# Every dependency is external; adjust hosts to your cluster.

existingSecret: ragflow-credentials

metadataDb:
  type: mysql
  host: mysql.data.svc.cluster.local
  port: 3306
  user: ragflow
  database: rag_flow

redis:
  host: redis-master.data.svc.cluster.local
  port: 6379

storage:
  type: minio
  minio:
    host: minio.data.svc.cluster.local
    port: 9000
    user: ragflow

docEngine:
  type: infinity
  infinity:
    host: infinity.data.svc.cluster.local

api:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12

executor:
  replicaCount: 4
  workers: 2

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: ragflow.internal.example.com
      paths:
        - path: /
          pathType: Prefix
