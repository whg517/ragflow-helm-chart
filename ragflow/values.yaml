# =============================================================================
# RAGFlow production chart values
#
# Design: all stateful dependencies (metadata DB, Redis, object storage, doc
# engine) are EXTERNAL. This chart manages only the three RAGFlow workloads.
# =============================================================================

global:
  imageRegistry: ""
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""
commonLabels: {}

image:
  registry: ""
  repository: infiniflow/ragflow
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  # Pin by digest for immutable production deploys. Takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# -----------------------------------------------------------------------------
# Credentials
#
# STRONGLY RECOMMENDED: pre-create a Secret and set existingSecret to its name.
# The chart never needs to see plaintext passwords that way.
#
# Required keys in the Secret:
#   MYSQL_PASSWORD        (or the matching var for your metadataDb.type)
#   MINIO_PASSWORD        / storage credentials
#   REDIS_PASSWORD
#   ELASTIC_PASSWORD | OPENSEARCH_PASSWORD  (only for that doc engine)
#
# Set existingSecret="" and fill `secretData` ONLY for throwaway environments.
# -----------------------------------------------------------------------------
existingSecret: ""
secretData: {}
#   MYSQL_PASSWORD: changeme
#   REDIS_PASSWORD: changeme
#   MINIO_PASSWORD: changeme

# -----------------------------------------------------------------------------
# Metadata database (external)
# Supported types come from api/db/db_models.py PooledDatabase:
#   mysql | postgres | oceanbase | gaussdb
# -----------------------------------------------------------------------------
metadataDb:
  type: mysql
  host: ""
  # Leave empty to get the right default for `type`:
  #   mysql 3306 | postgres 5432 | gaussdb 5432 | oceanbase 2881
  # Hardcoding 3306 here would silently follow you when switching to postgres.
  port: ""
  user: root
  database: rag_flow
  # NOTE: the password is NEVER set here. Every backend — including postgres
  # and oceanbase — reads it from MYSQL_PASSWORD in the Secret named by
  # `existingSecret`. For postgres/oceanbase an initContainer renders
  # local.service_conf.yaml from that env var at pod startup, because
  # entrypoint.sh does not interpolate ${VAR} in that file.
  postgres:
    maxConnections: 100
    staleTimeout: 30
    # Built-in single-replica PostgreSQL (official image). Provides
    # metadataDb.host automatically when enabled — the app points at the
    # in-cluster service. Single replica, no HA: for production use
    # CloudNativePG (https://cloudnative-pg.io) or a managed database and
    # leave this off.
    #
    # Password: POSTGRES_PASSWORD is sourced from the MYSQL_PASSWORD key of
    # your existingSecret (the same credential RAGFlow reads) — never set it
    # here.
    builtin:
      # Enable with: --set metadataDb.postgres.builtin.enabled=true
      enabled: false
      image:
        repository: postgres
        tag: "17"
        pullPolicy: IfNotPresent
      persistence:
        size: 20Gi
        storageClass: ""
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
  # For type=gaussdb the app reads GAUSSDB_METADATA_* env vars instead of
  # service_conf; the chart maps these fields onto them automatically.
  gaussdb:
    schema: public
    maxConnections: 100
    staleTimeout: 30

# -----------------------------------------------------------------------------
# Redis / Valkey (external) — task queue + cache
# -----------------------------------------------------------------------------
redis:
  host: ""
  port: 6379
  username: ""
  db: 1

# -----------------------------------------------------------------------------
# Object storage (external) — MinIO or any S3-compatible endpoint
# -----------------------------------------------------------------------------
storage:
  # minio | s3 | oss | azure | gcs
  type: minio
  minio:
    host: ""
    port: 9000
    user: rag_flow
    secure: false
    bucket: ""

# -----------------------------------------------------------------------------
# Document / vector engine (external)
# infinity is the lightest; elasticsearch/opensearch need their own clusters.
# -----------------------------------------------------------------------------
docEngine:
  type: infinity
  infinity:
    host: ""
  elasticsearch:
    host: ""
    port: 9200
    user: elastic
  opensearch:
    host: ""
    port: 9201
    user: admin

# -----------------------------------------------------------------------------
# OPTIONAL built-in dependencies (all default OFF — the chart's default
# posture is "all external").
# -----------------------------------------------------------------------------
# Valkey (official chart): provides REDIS_HOST when enabled. Credentials come
# from existingSecret (REDIS_PASSWORD key) — the chart wires auth for you.
valkey:
  enabled: false
  architecture: standalone
  # ACL auth: a single `default` user whose password is the REDIS_PASSWORD key
  # from your existingSecret — same credential RAGFlow reads, one source of
  # truth, nothing in values. usersExistingSecret is injected by
  # templates/common/_subchart-wiring.tpl at install time.
  auth:
    enabled: true
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: REDIS_PASSWORD

# OpenSearch (official chart): provides OS_HOST when enabled AND
# docEngine.type=opensearch. Heavy — size it for your cluster.
opensearch:
  enabled: false
  # Single-node dev/profile config; production should override replicas,
  # JVM heap and persistence.
  singleNode: true

# Built-in single-replica RustFS object storage (S3 API compatible).
# Production should disable this and point storage.minio at a real cluster.
rustfs:
  enabled: false
  image:
    repository: rustfs/rustfs
    tag: "latest"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  service:
    type: ClusterIP
    ports:
      api: 9000
      console: 9001
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# -----------------------------------------------------------------------------
# Shared, non-secret application env
# -----------------------------------------------------------------------------
env:
  TZ: Asia/Shanghai
  DOC_BULK_SIZE: "4"
  EMBEDDING_BATCH_SIZE: "16"
  # Uncomment where huggingface.co is unreachable:
  # HF_ENDPOINT: https://hf-mirror.com

extraEnv: {}
extraEnvFrom: []

# Optional override mounted at /ragflow/conf/local.service_conf.yaml
serviceConf: {}
# Optional override mounted at /ragflow/conf/llm_factories.json
llmFactories: {}

# -----------------------------------------------------------------------------
# Pod-level security.
#
# IMPORTANT: the stock infiniflow/ragflow image REQUIRES root (verified against
# v0.27.0): entrypoint.sh writes /ragflow/conf/service_conf.yaml, copies the
# nginx vhost into /etc/nginx/conf.d, and nginx binds :80 and writes
# /var/log/nginx. Those paths are root-owned 0755 and the image ships no
# non-root user. The defaults below therefore run as root and do NOT satisfy
# the PSA "restricted" profile - only "privileged"/unlabeled namespaces, or
# "baseline" if your policy does not force runAsNonRoot.
#
# If you rebuild the image with a non-root user (recommended hardening; needs a
# chown of /ragflow and a nginx config listening on >=1024), set:
#   podSecurityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000,
#                        fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
#   containerSecurityContext:
#     allowPrivilegeEscalation: false
#     capabilities: {drop: ["ALL"]}
# -----------------------------------------------------------------------------
podSecurityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1000

containerSecurityContext:
  allowPrivilegeEscalation: true
  readOnlyRootFilesystem: false
  # privileged: false

# =============================================================================
# Workload: api  (nginx + ragflow_server)
# Stateless. Scale freely.
# =============================================================================
api:
  enabled: true
  replicaCount: 2

  # Admin server listens on 9381 and is proxied at /api/v1/admin.
  # Disable unless you actually use it — it is an unauthenticated-by-default
  # control surface in some versions.
  adminServer:
    enabled: false
    port: 9381

  # Creates the first admin account (idempotent: skipped if the email already
  # exists). Email/password come from DEFAULT_SUPERUSER_EMAIL /
  # DEFAULT_SUPERUSER_PASSWORD in existingSecret - NOT from values. The app's
  # built-in defaults are admin@ragflow.io / "admin"; always override them via
  # the Secret in anything reachable by users.
  initSuperuser: false

  # Requires registration for the first login when initSuperuser is off. The
  # app default is open registration (REGISTER_ENABLED=1).
  registerEnabled: true

  service:
    type: ClusterIP
    port: 80
    apiPort: 9380
    annotations: {}

  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior: {}

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  livenessProbe:
    enabled: true
    # /api/v1/system/ping returns "pong" without touching dependencies, so a
    # transient DB blip won't get the container killed.
    httpGet:
      path: /api/v1/system/ping
      port: http
    # Runs only after the startupProbe gate passes.
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6

  readinessProbe:
    enabled: true
    # /api/v1/system/healthz verifies db + redis + doc_engine + storage and
    # returns 500 unless all four are ok.
    httpGet:
      path: /api/v1/system/healthz
      port: http
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  startupProbe:
    enabled: true
    httpGet:
      path: /api/v1/system/ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    # Allows up to 10 minutes for first boot (schema init can be slow).
    failureThreshold: 60

  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  extraVolumes: []
  extraVolumeMounts: []

# =============================================================================
# Workload: executor  (task_executor.py)
# StatefulSet: consumer names derive from hostname, and stable identities keep
# the Redis consumer group clean across restarts and scale-downs.
# =============================================================================
executor:
  enabled: true
  replicaCount: 2

  # Task executor processes per pod. Total concurrency = replicaCount * workers.
  workers: 1

  service:
    # Headless service backing the StatefulSet.
    annotations: {}

  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "8"
      memory: 16Gi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    # Queue-depth scaling needs KEDA; see values-keda.yaml example.
    behavior: {}

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  updateStrategy:
    type: RollingUpdate

  # A single parse task has a hard timeout of 80 minutes
  # (task_executor.py: @timeout(60 * 80, 1) on build_chunks). Kill earlier than
  # that and scale-in/node-drain aborts in-flight work: Redis Streams will
  # redeliver the unacked message, but you pay for duplicate parsing and
  # progress flapping. Keep this >= the task timeout.
  terminationGracePeriodSeconds: 4980

  livenessProbe:
    enabled: true
    # No HTTP surface on the executor, so check the process is alive.
    exec:
      command:
        - /bin/sh
        - -c
        # The [r] character class stops pgrep matching this probe's own
        # command line, which would make the probe always succeed.
        - pgrep -f "[r]ag/svr/task_executor.py" > /dev/null
    # Runs only after the startupProbe gate passes, so no initialDelay needed.
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 4

  readinessProbe:
    enabled: false

  startupProbe:
    enabled: true
    # ensure_db_init() runs BEFORE any worker spawns and can take minutes on a
    # cold cluster. Kubernetes does not run liveness while a startupProbe is
    # pending, so this gate - not the liveness delay - owns the boot window.
    exec:
      command:
        - /bin/sh
        - -c
        # The [r] character class stops pgrep matching this probe's own
        # command line, which would make the probe always succeed.
        - pgrep -f "[r]ag/svr/task_executor.py" > /dev/null
    periodSeconds: 10
    failureThreshold: 60

  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  extraVolumes: []
  extraVolumeMounts: []

# =============================================================================
# Workload: datasync  (sync_data_source.py)
# SINGLETON. rag/svr/sync_data_source.py holds no distributed lock, so two
# replicas would double-sync. replicas is fixed at 1 and the strategy is
# Recreate so a rolling update never briefly runs two.
# =============================================================================
datasync:
  enabled: true

  resources:
    requests:
      cpu: "500m"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  terminationGracePeriodSeconds: 120

  livenessProbe:
    enabled: true
    exec:
      command:
        - /bin/sh
        - -c
        # See the executor probe: [r] prevents self-matching.
        - pgrep -f "[r]ag/svr/sync_data_source.py" > /dev/null
    # Runs only after the startupProbe gate passes.
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 4

  startupProbe:
    enabled: true
    # datasync also runs ensure_db_init() before its sync loop starts.
    exec:
      command:
        - /bin/sh
        - -c
        - pgrep -f "[r]ag/svr/sync_data_source.py" > /dev/null
    periodSeconds: 10
    failureThreshold: 60

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraVolumes: []
  extraVolumeMounts: []

# =============================================================================
# Schema migration Job (pre-install / pre-upgrade hook)
# Keeps DDL out of the request-serving pods so N api replicas don't race.
# =============================================================================
migration:
  enabled: true
  initModelProviderTables: true
  backoffLimit: 3
  # Bounded so a misconfiguration (e.g. existingSecret naming a Secret that does
  # not exist) fails in minutes instead of blocking `helm install` for half an
  # hour. Raise it if you have a genuinely long-running schema migration.
  activeDeadlineSeconds: 300
  resources:
    requests:
      cpu: "500m"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

# =============================================================================
# Ingress
# =============================================================================
ingress:
  enabled: false
  className: nginx
  annotations:
    # Uploads default to a 128M cap in the app.
    nginx.ingress.kubernetes.io/proxy-body-size: "128m"
    # Chat streams over SSE.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: ragflow.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# =============================================================================
# NetworkPolicy
# =============================================================================
networkPolicy:
  enabled: false
  # Sources allowed to reach the api service.
  ingressFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx
  # Egress destinations. Leave empty to allow all egress (LLM APIs often need it).
  egressTo: []
  allowAllEgress: true
