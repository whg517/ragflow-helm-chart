{{- if not .Values.existingSecret }}
{{- if not .Values.secretData }}
{{- fail "Either existingSecret must be set, or secretData must contain the credentials. Refusing to deploy without credentials." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ragflow.fullname" . }}-env
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
  annotations:
    {{- /* Created during the hook phase so the pre-install migration Job can
           reference them; the Job is weight -5, these are -10 so they land
           first. `before-hook-creation` (not `hook-succeeded`) means they
           PERSIST for the long-running workloads. */}}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- /* Every value is quoted. Unquoted passwords that are all digits, or that
         start with a YAML sigil, would otherwise change type or break parsing —
         a real bug in the upstream chart. */}}
  {{- range $k, $v := .Values.secretData }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- /* The MySQL image wants MYSQL_ROOT_PASSWORD while RAGFlow reads
         MYSQL_PASSWORD; mirror it so an in-cluster DB stays interoperable. */}}
  {{- if and (hasKey .Values.secretData "MYSQL_PASSWORD") (not (hasKey .Values.secretData "MYSQL_ROOT_PASSWORD")) }}
  MYSQL_ROOT_PASSWORD: {{ get .Values.secretData "MYSQL_PASSWORD" | quote }}
  {{- end }}
  {{- if and (hasKey .Values.secretData "MINIO_PASSWORD") (not (hasKey .Values.secretData "MINIO_ROOT_PASSWORD")) }}
  MINIO_ROOT_PASSWORD: {{ get .Values.secretData "MINIO_PASSWORD" | quote }}
  {{- end }}
{{- end }}
