{{- if .Values.migration.enabled }}
{{- $component := "migration" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ragflow.componentName" (dict "root" . "component" $component) }}
  labels:
    {{- include "ragflow.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- /* Runs before the workloads on every install and upgrade, so schema
           DDL happens exactly once instead of racing across N api replicas.
           entrypoint.sh calls ensure_db_init() unconditionally, but a single
           serialized run up front avoids concurrent CREATE TABLE. */}}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "ragflow.componentLabels" (dict "root" . "component" $component) | nindent 8 }}
      {{- with .Values.migration.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "ragflow.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "ragflow.imagePullSecrets" . | nindent 6 }}
      {{- include "ragflow.podSecurityContext" . | nindent 6 }}
      {{- with .Values.migration.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migration.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- /* Fails fast with a message that names the missing key, instead of
               letting it surface as a late crash. */}}
        {{- include "ragflow.preflightInitContainer" . | nindent 8 }}
        {{- if and (eq .Values.metadataDb.type "postgres") .Values.metadataDb.postgres.builtin.enabled }}
        {{- /* Built-in postgres boots as a hook resource before this Job, but
               "created" != "accepting connections". Block until it is. */}}
        - name: wait-for-postgres
          image: {{ include "ragflow.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          command: ["python3", "-c"]
          args:
            - |
              import socket, sys, time
              host = "{{ include "ragflow.fullname" . }}"
              for i in range(60):
                  try:
                      socket.create_connection((host, 5432), timeout=2).close()
                      print("postgres is accepting connections")
                      sys.exit(0)
                  except OSError:
                      time.sleep(2)
              print("FATAL: postgres not reachable after ~120s", file=sys.stderr)
              sys.exit(1)
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
        {{- end }}
        {{- if include "ragflow.needsGeneratedServiceConf" . }}
        {{- include "ragflow.serviceConfInitContainer" . | nindent 8 }}
        {{- end }}
      containers:
        - name: migration
          image: {{ include "ragflow.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "ragflow.containerSecurityContext" . | nindent 10 }}
          args:
            {{- /* All three services disabled: entrypoint.sh still runs
                   ensure_db_init(), then exits instead of starting servers. */}}
            - "--disable-webserver"
            - "--disable-taskexecutor"
            - "--disable-datasync"
            {{- if .Values.api.initSuperuser }}
            {{- /* Idempotent upstream: init_superuser() returns early if the
                   email already exists, so this is safe on every upgrade. */}}
            - "--init-superuser"
            {{- end }}
            {{- if .Values.migration.initModelProviderTables }}
            {{- /* The model-provider migrations are MySQL-only SQL
                   (tools/scripts/mysql_migration.py, executed via pymysql).
                   Upstream skips them for gaussdb; postgres must skip them
                   too — verified on v0.27.0: with DB_TYPE=postgres the script
                   still opens a pymysql connection and dies with
                   "Lost connection to MySQL server during query". */}}
            {{- if eq .Values.metadataDb.type "mysql" }}
            - "--init-model-provider-tables"
            {{- end }}
            {{- end }}
          {{- include "ragflow.envFrom" . | nindent 10 }}
          {{- if .Values.api.initSuperuser }}
          env:
            {{- /* Credentials stay in the Secret; only the knob lives in values. */}}
            - name: DEFAULT_SUPERUSER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ragflow.secretName" . }}
                  key: DEFAULT_SUPERUSER_EMAIL
                  optional: false
            - name: DEFAULT_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ragflow.secretName" . }}
                  key: DEFAULT_SUPERUSER_PASSWORD
                  optional: false
          {{- end }}
          {{- with .Values.migration.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "ragflow.volumeMountsBlock" (dict "root" . "extra" list) | nindent 10 }}
      {{- include "ragflow.volumesBlock" (dict "root" . "extra" list) | nindent 6 }}
{{- end }}
