{{- include "ragflow.validateDbType" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ragflow.fullname" . }}-config
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
  annotations:
    {{- /* Created during the hook phase so the pre-install migration Job can
           reference them; the Job is weight -5, these are -10 so they land
           first. `before-hook-creation` (not `hook-succeeded`) means they
           PERSIST for the long-running workloads. */}}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- /* --- metadata database --- */}}
  DB_TYPE: {{ .Values.metadataDb.type | quote }}
  {{- if eq .Values.metadataDb.type "gaussdb" }}
  {{- /* GaussDB is configured purely through GAUSSDB_METADATA_* env vars.
         Source: common/settings.py load_database_config(). */}}
  GAUSSDB_METADATA_HOST: {{ required "metadataDb.host is required" .Values.metadataDb.host | quote }}
  GAUSSDB_METADATA_PORT: {{ include "ragflow.metadataDbPort" . | quote }}
  GAUSSDB_METADATA_USER: {{ .Values.metadataDb.user | quote }}
  GAUSSDB_METADATA_DBNAME: {{ .Values.metadataDb.database | quote }}
  GAUSSDB_METADATA_SCHEMA: {{ .Values.metadataDb.gaussdb.schema | quote }}
  GAUSSDB_METADATA_MAX_CONNECTIONS: {{ .Values.metadataDb.gaussdb.maxConnections | quote }}
  GAUSSDB_METADATA_STALE_TIMEOUT: {{ .Values.metadataDb.gaussdb.staleTimeout | quote }}
  {{- else }}
  {{- /* mysql / postgres / oceanbase all resolve through service_conf.yaml,
         whose template interpolates these MYSQL_* vars. */}}
  {{- if .Values.metadataDb.postgres.builtin.enabled }}
  {{- /* Built-in Postgres: in-cluster service. An explicit metadataDb.host
         still wins if someone sets both. */}}
  MYSQL_HOST: {{ default (printf "%s-postgres.%s.svc" .Release.Name .Release.Namespace) .Values.metadataDb.host | quote }}
  {{- else }}
  MYSQL_HOST: {{ required "metadataDb.host is required (or enable postgres.builtin)" .Values.metadataDb.host | quote }}
  {{- end }}
  MYSQL_PORT: {{ include "ragflow.metadataDbPort" . | quote }}
  MYSQL_USER: {{ .Values.metadataDb.user | quote }}
  MYSQL_DBNAME: {{ .Values.metadataDb.database | quote }}
  {{- end }}

  {{- /* --- redis --- */}}
  {{- if .Values.valkey.enabled }}
  {{- /* Built-in Valkey subchart: point at its in-cluster service.
         Release-scoped fullname, single-replica architecture. */}}
  REDIS_HOST: {{ printf "%s-valkey.%s.svc" .Release.Name .Release.Namespace | quote }}
  REDIS_PORT: "6379"
  {{- else }}
  REDIS_HOST: {{ required "redis.host is required (or enable the built-in valkey subchart)" .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  {{- with .Values.redis.username }}
  REDIS_USERNAME: {{ . | quote }}
  {{- end }}
  {{- end }}

  {{- /* --- object storage --- */}}
  {{- if eq .Values.storage.type "minio" }}
  {{- if .Values.rustfs.enabled }}
  {{- /* Built-in RustFS: in-cluster service on the api port. Explicit
         storage.minio.host still wins if someone sets both. */}}
  MINIO_HOST: {{ default (printf "%s-rustfs.%s.svc" .Release.Name .Release.Namespace) .Values.storage.minio.host | quote }}
  {{- else }}
  MINIO_HOST: {{ required "storage.minio.host is required (or enable the built-in rustfs)" .Values.storage.minio.host | quote }}
  {{- end }}
  MINIO_PORT: {{ default 9000 .Values.storage.minio.port | quote }}
  MINIO_USER: {{ .Values.storage.minio.user | quote }}
  MINIO_ROOT_USER: {{ .Values.storage.minio.user | quote }}
  MINIO_SECURE: {{ .Values.storage.minio.secure | quote }}
  {{- with .Values.storage.minio.bucket }}
  MINIO_BUCKET: {{ . | quote }}
  {{- end }}
  {{- end }}

  {{- /* --- doc engine --- */}}
  {{- include "ragflow.docEngineEnv" . | nindent 2 }}

  {{- /* --- misc app env --- */}}
  {{- /* Pin the server mode. entrypoint.sh's silent default is also python,
         but making it explicit guarantees the nginx vhost, the process layout
         and the chart's python-path probes stay mutually consistent. */}}
  API_PROXY_SCHEME: python
  REGISTER_ENABLED: {{ .Values.api.registerEnabled | ternary "1" "0" | quote }}
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- range $k, $v := .Values.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
