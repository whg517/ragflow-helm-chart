{{- if and .Values.executor.enabled .Values.executor.autoscaling.enabled }}
{{- $component := "executor" }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ragflow.componentName" (dict "root" . "component" $component) }}
  labels:
    {{- include "ragflow.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "ragflow.componentName" (dict "root" . "component" $component) }}
  minReplicas: {{ .Values.executor.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.executor.autoscaling.maxReplicas }}
  metrics:
    {{- with .Values.executor.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
  {{- with .Values.executor.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
