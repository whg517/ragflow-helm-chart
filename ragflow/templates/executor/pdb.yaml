{{- if and .Values.executor.enabled .Values.executor.podDisruptionBudget.enabled }}
{{- $component := "executor" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ragflow.componentName" (dict "root" . "component" $component) }}
  labels:
    {{- include "ragflow.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ragflow.componentSelectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  {{- with .Values.executor.podDisruptionBudget.minAvailable }}
  minAvailable: {{ . }}
  {{- end }}
  {{- with .Values.executor.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ . }}
  {{- end }}
{{- end }}
