{{- if .Values.api.enabled }}
{{- $component := "api" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ragflow.componentName" (dict "root" . "component" $component) }}
  labels:
    {{- include "ragflow.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "ragflow.componentSelectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
    - name: http-api
      port: {{ .Values.api.service.apiPort }}
      targetPort: http-api
      protocol: TCP
    {{- if .Values.api.adminServer.enabled }}
    - name: admin
      port: {{ .Values.api.adminServer.port }}
      targetPort: admin
      protocol: TCP
    {{- end }}
{{- end }}
